[package]
name = "renderguard"
version = "1.0.5"
description = "Blender 批量渲染队列 · 崩溃自动续接"
edition = "2021"
rust-version = "1.77"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
regex-lite = "0.1"
md-5 = "0.10"
sha1 = "0.10"
sha2 = "0.10"
image = { version = "0.25", default-features = false, features = [
    "png",
    "jpeg",
    "gif",
    "webp",
    "tiff",
    "tga",
    "bmp",
    "exr",
    "hdr",
    "ico",
    "pnm",
    "dds",
    "qoi",
] }

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true

[profile.dev]
opt-level = 1
